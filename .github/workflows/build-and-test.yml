name: Build and test
on: [push, pull_request]

env:
  LLVM_COMMIT: 1053047a4be7d1fece3adaf5e7597f838058c947

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Get TAFFO
        uses: actions/checkout@v6
      - name: Restore LLVM
        id: cache-llvm
        uses: actions/cache/restore@v5
        with:
          path: llvm-project/install_release
          key: ${{ runner.os }}-llvm-${{ env.LLVM_COMMIT }}-release
      - name: Get LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: 'llvm/llvm-project'
          ref: '${{ env.LLVM_COMMIT }}'
          path: 'llvm-project'
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          cmake -S llvm-project/llvm -B llvm-project/build_release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/llvm-project/install_release" \
            -DLLVM_ENABLE_PROJECTS="mlir;clang" \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DLLVM_INSTALL_UTILS=ON \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build llvm-project/build_release --target install --parallel 2
      - name: Save LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: llvm-project/install_release
          key: ${{ steps.cache-llvm.outputs.cache-primary-key }}
      - name: Configure TAFFO
        run: |
          cmake -S . -B build_debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR="$GITHUB_WORKSPACE/llvm-project/install_release/lib/cmake/llvm" \
            -DMLIR_DIR="$GITHUB_WORKSPACE/llvm-project/install_release/lib/cmake/mlir" \
            -DLLVM_EXTERNAL_LIT="$GITHUB_WORKSPACE/llvm-project/install_release/bin/llvm-lit"
      - name: Build TAFFO
        run: cmake --build build_debug --parallel 2
      - name: Test TAFFO
        run: cmake --build build_debug --target check
